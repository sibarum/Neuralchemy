## Feature (RaylibFeature) is registered via META-INF/services/org.graalvm.nativeimage.hosted.Feature.
## Resource includes live in resource-config.json (sibling of this file) — that's the
## non-experimental replacement for the older -H:IncludeResources flag.
Args = --initialize-at-run-time=com.raylib.bindings,com.raylib.RaylibLoader \
       --enable-native-access=ALL-UNNAMED
