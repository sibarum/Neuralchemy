## Belt-and-suspenders Feature wiring: both modules also publish Feature SPI files at
## META-INF/services/org.graalvm.nativeimage.hosted.Feature, but native-image's discovery
## of those across multiple jars has been flaky in practice — listing them explicitly here
## guarantees both run for the consuming image build.
## Resource includes live in resource-config.json (sibling of this file).
Args = --features=com.raylib.svm.RaylibFeature,com.raygui.svm.RayguiFeature \
       --initialize-at-run-time=com.raygui.bindings,com.raygui.RayguiLoader,com.raygui.Gui \
       --enable-native-access=ALL-UNNAMED
